# El PC es el de Jose: memoria y workers contenidos.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin dentro del demonio de Gradle (sin un segundo demonio de 4 GB) y el demonio se apaga solo.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=900000
