services:
  db:
    image: postgres:16-alpine
    container_name: notiono-db
    environment:
      POSTGRES_USER: notely
      POSTGRES_PASSWORD: notely
      POSTGRES_DB: notely
    expose:
      - "5432"
    volumes:
      - notely-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: "postgresql://notely:notely@db:5432/notely"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        # Misma dirección que la web con la ruta /collab: el propio servidor de
        # la app atiende ahí el WebSocket de la edición simultánea.
        NEXT_PUBLIC_COLLAB_URL: "wss://notiono.monrealperez.com/collab"
    container_name: notiono-app
    # Sin `command`: manda el CMD de la imagen (node server.mjs). Aquí ponía
    # `node server.js`, que era el servidor que generaba el modo standalone de
    # Next; ese modo ya no se usa y ese fichero no existe en la imagen.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://notely:notely@db:5432/notely"
      AUTH_SECRET: "dev-secret-cambiar-en-prod"
      NODE_ENV: "production"
      OIDC_ISSUER: "https://monrealperez.com/sso/webman/sso"
      OIDC_CLIENT_ID: "aaffef367517843c60a650c711c87010"
      OIDC_CLIENT_SECRET: "2ZAb6KOLZ9A6LnpbGqCMCsc2SEBnUJtl"
      OIDC_REDIRECT_URI: "https://notiono.monrealperez.com/api/auth/oidc/callback"
      OIDC_PROVIDER_NAME: "Synology"
      # Huella de la firma del APK de Android: con ella, /.well-known/assetlinks.json
      # confirma que esa app es de este dominio y Chrome le quita la barra de
      # direcciones. Sale del almacén de claves (ver docs/android.md); si algún día
      # se firma con otro almacén, hay que cambiarla aquí y volver a desplegar.
      ANDROID_CERT_FINGERPRINT: "8C:9B:B7:DC:6C:FB:0F:64:49:42:A3:E8:0A:B3:95:CA:8E:D8:C3:2F:4A:B7:18:25:C8:67:E3:0F:40:CB:8E:9A"
      # Token para el gateway de OpenClaw en los webhooks salientes. Los valores
      # reales viven en el .env/entorno del host (el del NAS ya los tiene); sin
      # ellos la cabecera x-openclaw-token simplemente no se añade.
      OPENCLAW_HOOK_TOKEN: "${OPENCLAW_HOOK_TOKEN}"
      OPENCLAW_HOOK_URL_PREFIX: "${OPENCLAW_HOOK_URL_PREFIX}"
      OPENCLAW_NOTIF_BASE: "${OPENCLAW_NOTIF_BASE}"
      OPENCLAW_NOTIF_ROUTES: "${OPENCLAW_NOTIF_ROUTES}"
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  notely-db-data:
